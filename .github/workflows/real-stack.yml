# KeelBase-YuDao · 真栈场景门（28 道）—— 一条作业，一整套栈。
#
# `ci.yml` 里只有 `conformance` 一道作业要活栈；本仓另有 28 道 `scripts/run-*-scenarios.mjs`
# 真栈门，此前只能在本机手工起栈、手工灌库、手工跑。本作业把那一串动作照原样搬上 GitHub
# Actions：起**具名** PG/Redis 容器 → 灌库（上游 schema + 部署清单的 `load` 行 + bpm/fms 两份
# 建表）→ 构建宿主 → 起宿主并等它应答 → 跑 `scripts/run-all-scenarios.sh`。
#
# 为什么要**具名**容器而不是 `services:`。各道门经 `docker exec "$PG_CONTAINER" psql` 访问数据库；
# `services:` 的容器名由 Actions 生成、不可点，而 `PG_CONTAINER` 要的正是那个名字。
#
# 谁**不跑**，以及为什么：
#
#   * `run-model-loop-scenarios.mjs` —— 由 `run-all-scenarios.sh` 自己打 `SKIP`（它要一个按
#     「模型回路已打开」起的宿主，本作业不起那样的宿主），不算失败。
#   * `run-ai1-crm-scenarios.mjs` / `run-assistant-drawer-scenarios.mjs` /
#     `run-mcp-governance-scenarios.mjs` —— 三道都要真模型 key，且**没有 key 就直接 exit 1**
#     （它们从 `KEY_FILE` 读，不从宿主读）。仓库 secret `SPRING_AI_ENV` 没配时，本作业把这三份
#     文件移出 `scripts/` 的发现范围、逐条记进日志与 artifact，并以 `SKIP` 说明理由 —— 不伪装成
#     通过，也不让作业因为一个本机才有的 key 永久变红。配了 secret，三道照常跑。
#
# 与 `ci.yml` 的分工：本文件只回答「28 道真栈门对着真栈跑得过吗」这一问；`ci.yml` 那些纯 Node 与
# 治理检查不在这里重复。
#
# ---
#
# KeelBase-YuDao · the 28 real-stack scenario gates — one job, one stack.
#
# `ci.yml` has exactly one job that needs a live stack (`conformance`); this repository also ships 28
# `scripts/run-*-scenarios.mjs` gates that could only be run by hand — start the stack, seed it, build,
# run each gate. This job carries that same sequence onto GitHub Actions: named PostgreSQL/Redis
# containers → seed (upstream schema + the deployment manifest's `load` lines + the bpm/fms DDL) →
# build the host → start it and wait until it answers → `scripts/run-all-scenarios.sh`.
#
# Why **named** containers rather than `services:`. Every gate reaches PostgreSQL through
# `docker exec "$PG_CONTAINER" psql`; a service container's name is generated by Actions and cannot be
# pointed at, and that name is exactly what `PG_CONTAINER` wants.
#
# What does **not** run, and why:
#
#   * `run-model-loop-scenarios.mjs` — `run-all-scenarios.sh` prints `SKIP` for it itself (it wants a
#     host started with the model loop on, and this job does not start one); not a failure.
#   * `run-ai1-crm-scenarios.mjs` / `run-assistant-drawer-scenarios.mjs` /
#     `run-mcp-governance-scenarios.mjs` — all three need a real model key and **exit 1 without one**
#     (they read it from `KEY_FILE`, not from the host). When the repository secret `SPRING_AI_ENV` is
#     absent, this job moves those three files out of `scripts/` discovery, records one `SKIP` line each
#     in the log and the artifact, and says why — never a quiet pass, and never a job that is
#     permanently red over a key only a developer has. With the secret configured, all three run.
#
# Division of labour with `ci.yml`: this file answers only "do the 28 real-stack gates pass against a
# real stack"; the pure-Node and governance checks in `ci.yml` are not duplicated here.
name: Real-stack scenario gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PG_CONTAINER: gate-pg
  REDIS_CONTAINER: gate-redis
  PG_DB: gates_ci
  PG_USER: root
  PG_PASSWORD: password
  # 只用回环地址发布端口：runner 上的容器不必对外可及。Binds are loopback-only; nothing on the
  # runner needs to reach these ports from outside.
  PG_HOST_PORT: '55462'
  REDIS_HOST_PORT: '56392'
  HOST_PORT: '48187'
  HOST_URL: http://127.0.0.1:48187

jobs:
  scenario-gates:
    name: Every real-stack scenario gate passes against a running host
    runs-on: ubuntu-latest
    # 冷 runner：拉两次镜像、构建整个 reactor、灌 120 张表、跑 25 道门。40 分钟是上限，不是通常耗时。
    # A cold runner pulls two images, builds the reactor, seeds 120 tables and runs 25 gates. 40 minutes
    # is the ceiling, not the expected time.
    timeout-minutes: 40
    env:
      KEELBASE_AUDIT_KEY: ci-real-stack-key

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `-p 127.0.0.1:...`：端口只挂在回环上。就绪判据用各自的客户端（`pg_isready` /
      # `redis-cli ping`），而不是 sleep —— 「容器起了」与「它接得住连接」是两件事。
      #
      # `-p 127.0.0.1:...` keeps the ports on loopback. Readiness is decided by each client
      # (`pg_isready` / `redis-cli ping`), never by sleeping: "the container started" and "it accepts
      # connections" are different facts.
      - name: Start named PostgreSQL and Redis containers
        run: |
          set -euo pipefail
          docker run -d --name "$PG_CONTAINER" \
            -e POSTGRES_USER="$PG_USER" \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -e POSTGRES_DB="$PG_DB" \
            -p "127.0.0.1:$PG_HOST_PORT:5432" \
            pgvector/pgvector:pg17
          docker run -d --name "$REDIS_CONTAINER" \
            -p "127.0.0.1:$REDIS_HOST_PORT:6379" \
            redis:7-alpine
          for i in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -U "$PG_USER" -d "$PG_DB" >/dev/null 2>&1; then
              echo "postgres is ready after $((i * 2))s"
              break
            fi
            sleep 2
          done
          docker exec "$PG_CONTAINER" pg_isready -U "$PG_USER" -d "$PG_DB"
          for i in $(seq 1 30); do
            if [ "$(docker exec "$REDIS_CONTAINER" redis-cli ping 2>/dev/null)" = "PONG" ]; then
              echo "redis is ready after $((i * 2))s"
              break
            fi
            sleep 2
          done
          test "$(docker exec "$REDIS_CONTAINER" redis-cli ping)" = "PONG"

      # 灌库次序就是 `scenario-all-20261102` 与 `all-scenarios-run-1103` 两份交接件用的那一串：
      # 上游 schema（`bootstrap-db.sh` 第 3 步）→ 清单里的 `load` 行（第 4 步）→ 本部署的菜单收敛
      # 与上传存储（第 5–6 步）。之后**另灌** bpm/fms 两份建表：清单里它们是 `skip`（部署不展示
      # bpm 菜单、fms 不在部署 jar 里），而这两组门要的是**真表**。
      #
      # The seed order is the one the 2026-11-02/11-03 hand-offs used: upstream schema (step 3 of
      # `bootstrap-db.sh`) → the manifest's `load` lines (step 4) → this deployment's menu scoping and
      # upload store (steps 5–6). Then bpm/fms are loaded **in addition**: the manifest marks them
      # `skip` (bpm's menus are not shown, fms is not in the deployment jar) while those two gate
      # groups need the real tables.
      - name: Seed the database
        env:
          PUBLIC_ORIGIN: ${{ env.HOST_URL }}
        run: |
          set -euo pipefail
          bash deploy/demo-ecs/bootstrap-db.sh 2>&1 | tee seed.log
          for f in sql/keelbase-bpm.sql sql/keelbase-fms.sql; do
            echo "loading $f"
            docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -v ON_ERROR_STOP=1 -q < "$f"
          done
          docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -tAc \
            "select '  表数 = ' || count(*) from information_schema.tables where table_schema='public';"

      # `-DskipTests` 而不是 `-Dmaven.test.skip=true`：测试类要**编译**出来。BPM/FMS 两组门在进程内
      # 以 `-o` 跑 `mvn ... test` 读 surefire 计数，所需依赖必须在同一次构建里解析过。
      #
      # `-DskipTests`, not `-Dmaven.test.skip=true`: the test classes have to be **compiled**. The
      # BPM/FMS gates run `mvn ... test` in-process with `-o` and read the surefire counts, so the
      # dependencies they need must have been resolved by this same build.
      - name: Build the host
        timeout-minutes: 25
        run: >-
          KEELBASE_JDK25="$JAVA_HOME" bash scripts/jdk25.sh mvn -B -ntp
          -pl yudao-server -am -DskipTests package 2>&1 | tee build.log

      # 门禁以 `-o` 跑 `mvn ... test`，而 `-DskipTests` 只编译测试、不解析 surefire 的 provider。
      # pin 一变 pom 就变，setup-java 的 maven 缓存键随之失效；冷库里那一件缺着，测试进程根本起不来，
      # 报告缺失又被门禁读成「未通过」。这一步在线跑同一个测试类一次，把 provider 解析进本作业用的本地库。
      #
      # The gates run `mvn ... test` with `-o`, but `-DskipTests` only compiles the tests and never
      # resolves surefire's provider. A pin bump changes the pom, which rotates setup-java's maven
      # cache key; on the cold repository that artifact is absent, the test process cannot start at
      # all, and the missing reports are read as "not passing". This step runs one test class online
      # so the provider lands in the same local repository this job builds against.
      - name: Warm the offline test provider
        timeout-minutes: 10
        run: >-
          KEELBASE_JDK25="$JAVA_HOME" bash scripts/jdk25.sh mvn -B -ntp
          -pl yudao-server -am -Dtest=FmsReportingToolsTest -DfailIfNoTests=false
          -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee warm-test-provider.log

      # `repackage` 没跑时产物是个普通 jar：起它时会以「no main manifest attribute」失败，而这句
      # 让失败发生在**构建这一步**、并说出是哪个文件。顺手记下 jar 里三个 `keelbase4j-*` 的版本，
      # 好把「跑的是不是钉住的那一版」变成一条读数。
      #
      # Without `repackage` the artifact is a plain jar: starting it dies with "no main manifest
      # attribute". This step turns that into a failure **at the build**, naming the file. It also
      # records the three `keelbase4j-*` versions inside the jar, so "is this the pinned runtime?"
      # is a reading rather than a guess.
      - name: The jar must be executable, on the pinned runtime
        run: |
          set -euo pipefail
          JAR=yudao-server/target/yudao-server.jar
          test -f "$JAR"
          if ! unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -Eq '^Main-Class: '; then
            echo "::error::$JAR has no Main-Class — spring-boot repackage did not run"
            unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' || true
            exit 1
          fi
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -E '^(Main-Class|Start-Class):'
          ls -lh "$JAR"
          unzip -l "$JAR" 'BOOT-INF/lib/keelbase4j-*' | tee jar-runtime.txt

      # 等 `/app/capabilities` 答 200：那道门自己也是用这个端点判断「宿主在跑」的，故用同一个判据。
      # 宿主进程提前退出时立即失败并把尾巴打出来 —— 等满超时只会把一条清楚的错变成一条模糊的错。
      #
      # Wait for `/app/capabilities` to answer 200: the gates use that same endpoint to decide "the
      # host is running", so the job uses the same criterion. If the host process exits early, fail at
      # once and print its tail — sitting out the timeout would turn a clear error into a vague one.
      - name: Start the host and wait for it to answer
        env:
          PORT: ${{ env.HOST_PORT }}
          PG_PORT: ${{ env.PG_HOST_PORT }}
          PG_HOST: 127.0.0.1
          PG_DB: ${{ env.PG_DB }}
          PG_USER: ${{ env.PG_USER }}
          PG_PASSWORD: ${{ env.PG_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ env.REDIS_HOST_PORT }}
          ACCESS_LOG: 'false'
        run: |
          set -euo pipefail
          KEELBASE_JDK25="$JAVA_HOME" bash scripts/run-server.sh > host.log 2>&1 &
          echo $! > host.pid
          for i in $(seq 1 150); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/app/capabilities" || true)" = "200" ]; then
              echo "host is UP after $((i * 2))s"
              exit 0
            fi
            if ! kill -0 "$(cat host.pid)" 2>/dev/null; then
              echo "the host exited before it answered /app/capabilities" >&2
              tail -n 200 host.log >&2 || true
              exit 1
            fi
            sleep 2
          done
          echo "the host did not answer /app/capabilities in 300s" >&2
          tail -n 200 host.log >&2 || true
          exit 1

      # 三道真模型门有没有 key 的处置，见文件头。写进 `GITHUB_STEP_SUMMARY` 与 `ci-skip-notices.txt`，
      # 两份都随 artifact 上传 —— 「哪几道这轮没跑、为什么」必须留在可以被人读到的地方。
      #
      # How the three real-model gates are handled without a key is described at the top of this file.
      # The notices go to `GITHUB_STEP_SUMMARY` and to `ci-skip-notices.txt`; both travel with the
      # artifact, so "which gates did not run, and why" is written somewhere a person can read it.
      - name: Decide which model gates can run here
        env:
          SPRING_AI_ENV: ${{ secrets.SPRING_AI_ENV }}
        run: |
          set -euo pipefail
          MODEL_GATES="run-ai1-crm-scenarios.mjs run-assistant-drawer-scenarios.mjs run-mcp-governance-scenarios.mjs"
          : > ci-skip-notices.txt
          if [ -n "${SPRING_AI_ENV:-}" ]; then
            printf '%s\n' "$SPRING_AI_ENV" > "$RUNNER_TEMP/spring-ai.env"
            echo "KEY_FILE=$RUNNER_TEMP/spring-ai.env" >> "$GITHUB_ENV"
            echo "model key supplied (secret SPRING_AI_ENV) — the three model gates run" | tee -a ci-skip-notices.txt
          else
            mkdir -p "$RUNNER_TEMP/ci-skipped"
            for g in $MODEL_GATES; do
              mv "scripts/$g" "$RUNNER_TEMP/ci-skipped/$g"
              echo "SKIP $g — needs a real model key (KEY_FILE); no SPRING_AI_ENV secret is configured" | tee -a ci-skip-notices.txt
            done
          fi
          { echo '### Real-stack gates'; echo; sed 's/^/- /' ci-skip-notices.txt; } >> "$GITHUB_STEP_SUMMARY"

      # `MVN` / `MVN_REPO`：BPM/FMS 两组门在进程内跑 `mvn -o ... test`，其默认值是本机路径。这里指到
      # PATH 上的 mvn 与本步构建用的同一个本地库，故离线解析用得着的就是构建刚下过的那些件。
      #
      # `MVN` / `MVN_REPO`: the BPM/FMS gates run `mvn -o ... test` in-process, and their defaults are
      # Windows paths. This points them at the mvn on PATH and the same local repository the build
      # used, so offline resolution has exactly the artifacts that build just downloaded.
      - name: Run every scenario gate
        timeout-minutes: 30
        env:
          HOST_URL: ${{ env.HOST_URL }}
          PG_CONTAINER: ${{ env.PG_CONTAINER }}
          PG_DB: ${{ env.PG_DB }}
          PG_USER: ${{ env.PG_USER }}
          # 旁路审计门会自己再起一个宿主（开关关），它连的是**宿主侧**端口；这些值必须与「起宿主并等应答」
          # 那一步逐项一致，否则第二个宿主回落到 `run-server.sh` 的默认端口、连不上库并在十几秒内退出。
          #
          # The bypass-audit gate starts a second host itself (switch off) and that host dials the **host-side**
          # ports; these must match the "Start the host" step item for item, or the second host falls back to
          # `run-server.sh`'s default ports, cannot reach the database and exits within seconds.
          PG_HOST: 127.0.0.1
          PG_PORT: ${{ env.PG_HOST_PORT }}
          PG_PASSWORD: ${{ env.PG_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ env.REDIS_HOST_PORT }}
          ACCESS_LOG: 'false'
          # 第二个宿主的日志落在工作区内，随 artifact 一起上传 —— 下一次红要能自己说明为什么。
          # The second host's log lands inside the workspace and travels with the artifact, so the next red
          # explains itself.
          EVIDENCE_DIR: ${{ github.workspace }}/bypass-audit-evidence
          MVN: mvn
        run: |
          set -uo pipefail
          # 门自己在进程内经 `scripts/jdk25.sh` 跑 mvn；把 runner 的 JDK 25 交给它，免得它去 Adoptium
          # 再下一份（下载是兜底，不是 CI 该走的路）。
          # The gates run mvn in-process through `scripts/jdk25.sh`; hand it the runner's JDK 25 so it
          # does not pull a second copy from Adoptium (the download is the fallback, not CI's path).
          export KEELBASE_JDK25="$JAVA_HOME"
          export MVN_REPO="$HOME/.m2/repository"
          export SCENARIO_LOG_DIR="$PWD/scenario-logs"
          # `set +e` 只为让 `rc` 这一行跑得到：Actions 的命令行壳自带 `-e`，否则红的那次会在取退出码
          # 之前就结束这一步，日志里只剩「红了」、没有那句读数。
          # `set +e` only so the `rc` line is reached: Actions' shell has `-e` on, and without this a red
          # run ends the step before the exit code is recorded — the log would say "red" and nothing else.
          set +e
          bash scripts/run-all-scenarios.sh 2>&1 | tee gate-run.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "run-all-scenarios.sh exited $rc"
          exit "$rc"

      # `always()`：红的那些读数才是要看的。宿主日志、逐门日志、汇总、跳过说明、库里的表数一起上传。
      # `always()`: the readings of a red run are the ones worth reading. Host log, per-gate logs, the
      # summary, the skip notices and the table count travel together.
      - name: Upload the readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-stack-gates
          path: |
            host.log
            seed.log
            build.log
            gate-run.log
            jar-runtime.txt
            ci-skip-notices.txt
            scenario-logs/
            bypass-audit-evidence/
          if-no-files-found: warn

      - name: Report the host's tail when the run went red
        if: failure()
        run: tail -n 200 host.log || true

      - name: Stop the containers
        if: always()
        run: |
          docker rm -f "$PG_CONTAINER" "$REDIS_CONTAINER" || true
